name: Build iOS App

on:
  push:
    branches: [ main, master ] # Hangi dala kod atıldığında çalışacağını belirtir

jobs:
  build:
    runs-on: macos-latest # Bulutta bir Mac bilgisayar çalıştırır

    steps:
      # 1. Projeyi buluta indir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Flutter ortamını kur
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Projenin kullandığı flutter sürümü
          channel: 'stable'
          cache: true

      # 3. Bağımlılıkları yükle
      - name: Install dependencies
        run: flutter pub get

      # 4. iOS için derleme yap (Test amaçlı imzasız build)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign
